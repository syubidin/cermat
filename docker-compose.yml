services:
  postgres:
    image: postgres:16-alpine
    container_name: cermat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cermat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - cermat_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cermat"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cermat-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cermat
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      JWT_SECRET: cermat-super-secure-production-jwt-secret-key-32bytes-min!!
      BOOTSTRAP_OPERATOR_PASSWORD: OperatorSecret123!
      BOOTSTRAP_AUDITOR_PASSWORD: AuditorSecret123!

volumes:
  cermat_pgdata:
