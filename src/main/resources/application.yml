spring:
  application:
    name: cermat
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:cermat}}}
    username: ${SPRING_DATASOURCE_USERNAME:${PGUSER:${DB_USERNAME:postgres}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:${DB_PASSWORD:password_default_dev}}}
  jpa:
    hibernate:
      ddl-auto: validate                # skema dikelola Flyway, bukan Hibernate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

cermat:
  jwt:
    secret: ${JWT_SECRET:cermat-super-secure-production-jwt-secret-key-32bytes-min!!}
    ttl-minutes: 30
  bootstrap:
    operator-password: ${BOOTSTRAP_OPERATOR_PASSWORD:}
    auditor-password: ${BOOTSTRAP_AUDITOR_PASSWORD:}
