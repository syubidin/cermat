spring:
  application:
    name: cermat
  datasource:
    url: jdbc:postgresql://localhost:5432/cermat
    username: postgres
    password: ${DB_PASSWORD:password_default_dev}   # untuk dev lokal saja
  jpa:
    hibernate:
      ddl-auto: validate                # skema dikelola Flyway, bukan Hibernate
    open-in-view: false
  flyway:
    enabled: true
server:
  port: 8080
cermat:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-please-change-this-32bytes-min!!}
    ttl-minutes: 30
  bootstrap:
    operator-password: ${BOOTSTRAP_OPERATOR_PASSWORD:}
    auditor-password: ${BOOTSTRAP_AUDITOR_PASSWORD:}
